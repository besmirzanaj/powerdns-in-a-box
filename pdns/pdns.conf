setuid=pdns
setgid=pdns

launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.sqlite

api=yes
api-key=CHANGE_ME_API_KEY
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

local-address=0.0.0.0
local-port=5300

primary=yes
default-soa-content=ns1.example.com hostmaster.example.com 0 10800 3600 604800 3600

# Hardening: hide implementation details from scanners. version.bind /
# version.server CHAOS-class TXT queries return "anonymous"; id.server
# queries are refused entirely instead of returning the container hostname.
version-string=anonymous
server-id=disabled