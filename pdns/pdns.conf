setuid=pdns
setgid=pdns

launch=gmysql
gmysql-host=mariadb
gmysql-port=3306
gmysql-dbname=pdns
gmysql-user=pdns
gmysql-password=ChangePdnsDbPass123!

api=yes
api-key=ChangePdnsApiKey123!
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

local-address=0.0.0.0
local-port=5300

primary=yes
default-soa-content=ns1.example.com hostmaster.example.com 0 10800 3600 604800 3600
version-string=anonymous
