setuid=pdns
setgid=pdns

launch=gpgsql
gpgsql-host=postgres
gpgsql-port=5432
gpgsql-dbname=powerdns
gpgsql-user=pdns
gpgsql-password=CHANGE_ME_PG_PASS

api=yes
api-key=CHANGE_ME_API_KEY
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0

local-address=0.0.0.0
local-port=5300

primary=yes
default-soa-content=ns1.example.com hostmaster.example.com 0 10800 3600 604800 3600

version-string=anonymous
server-id=disabled