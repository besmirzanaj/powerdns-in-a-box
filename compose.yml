version: "3.9"

networks:
  default:
    name: powerdns-in-a-box_default
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.1.0/24

services:
  mariadb:
    image: docker.io/library/mariadb:10.11
    container_name: pdns-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql:Z
      - ./mysql-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  pdns:
    image: docker.io/powerdns/pdns-auth-49:latest
    container_name: pdns-auth
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./pdns/pdns.conf:/etc/powerdns/pdns.conf:ro,Z
    expose:
      - "5300/tcp"
      - "5300/udp"
      - "8081/tcp"
    # Publish the HTTP API / webserver on loopback + the host's Tailscale
    # IP. Operators reach it from any tailnet device at
    # http://${TAILSCALE_BIND_IP}:8081/, or locally via 127.0.0.1.
    # Internal container-to-container access (PowerDNS-Admin -> pdns) still
    # works over the compose network at 10.89.1.10:8081.
    ports:
      - "127.0.0.1:8081:8081/tcp"
      - "${TAILSCALE_BIND_IP}:8081:8081/tcp"
    networks:
      default:
        ipv4_address: 10.89.1.10

  dnsdist:
    image: docker.io/powerdns/dnsdist-19:latest
    container_name: dnsdist
    restart: unless-stopped
    # Run as root so dnsdist can bind privileged port 53 inside the container.
    # Image default user (pdns/uid 953) cannot bind <1024 under SELinux-managed
    # capabilities on Podman/Rocky 9.
    user: "0:0"
    depends_on:
      - pdns
    environment:
      DNSDIST_WEBSERVER_PASSWORD: ${DNSDIST_WEBSERVER_PASSWORD}
      DNSDIST_API_KEY: ${DNSDIST_API_KEY}
    volumes:
      - ./dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro,Z
    # DNS (53) on the host's public IP. The dnsdist web console / API on
    # 8083 is on loopback + the Tailscale IP so it's reachable from the
    # tailnet but not the public internet.
    ports:
      - "${DNSDIST_BIND_IP}:53:53/tcp"
      - "${DNSDIST_BIND_IP}:53:53/udp"
      - "127.0.0.1:8083:8083/tcp"
      - "${TAILSCALE_BIND_IP}:8083:8083/tcp"
    networks:
      default:
        ipv4_address: 10.89.1.20

  powerdns-admin:
    image: docker.io/powerdnsadmin/pda-legacy:latest
    container_name: powerdns-admin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      pdns:
        condition: service_started
    environment:
      SQLALCHEMY_DATABASE_URI: mysql://${PDA_DB_USER}:${PDA_DB_PASS}@mariadb/${PDA_DB_NAME}
      SECRET_KEY: ${PDA_SECRET_KEY}
      GUNICORN_TIMEOUT: "60"
      GUNICORN_WORKERS: "2"
      GUNICORN_LOGLEVEL: "INFO"
      OFFLINE_MODE: "False"
    # Loopback + the host's Tailscale IP. Operators reach the UI at
    # http://${TAILSCALE_BIND_IP}:9090/ from any tailnet device.
    ports:
      - "127.0.0.1:9090:80"
      - "${TAILSCALE_BIND_IP}:9090:80"
