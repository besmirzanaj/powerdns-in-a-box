version: "3.9"

services:
  mariadb:
    image: docker.io/library/mariadb:10.11
    container_name: pdns-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql:Z
      - ./mysql-init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  pdns:
    image: docker.io/powerdns/pdns-auth-49:latest
    container_name: pdns-auth
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./pdns/pdns.conf:/etc/powerdns/pdns.conf:ro,Z
    expose:
      - "5300/tcp"
      - "5300/udp"
      - "8081/tcp"

  dnsdist:
    image: docker.io/powerdns/dnsdist-19:latest
    container_name: dnsdist
    restart: unless-stopped
    depends_on:
      - pdns
    volumes:
      - ./dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro,Z
    ports:
      - "${DNSDIST_BIND_IP}:53:53/tcp"
      - "${DNSDIST_BIND_IP}:53:53/udp"

  powerdns-admin:
    image: docker.io/powerdnsadmin/pda-legacy:latest
    container_name: powerdns-admin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      pdns:
        condition: service_started
    environment:
      SQLALCHEMY_DATABASE_URI: mysql://${PDA_DB_USER}:${PDA_DB_PASS}@mariadb/${PDA_DB_NAME}
      SECRET_KEY: ${PDA_SECRET_KEY}
      GUNICORN_TIMEOUT: "60"
      GUNICORN_WORKERS: "2"
      GUNICORN_LOGLEVEL: "INFO"
      OFFLINE_MODE: "False"
    ports:
      - "9090:80"
