setLocal("0.0.0.0:53")
addACL("0.0.0.0/0")

-- dnsdist's newServer() requires an IP literal at config-load time, not a
-- hostname. The pdns container is pinned to 10.89.1.10 in compose.yml.
newServer({
  address="10.89.1.10:5300",
  name="pdns-auth",
  pool="auth"
})

addAction(AllRule(), PoolAction("auth"))

-- Web console / HTTP API on :8083 inside the container. The published port
-- is bound to the host's public IP in compose.yml; firewalld is the trust
-- boundary that restricts source IPs.
--
-- Podman's netavark networking preserves the original client source IP
-- through the DNAT (no masquerade on inbound), so dnsdist sees real
-- external IPs — not the bridge gateway. We therefore leave dnsdist's
-- own webserver ACL wide open and let the host firewall do the gating.
local web_pw  = os.getenv("DNSDIST_WEBSERVER_PASSWORD") or "changeme"
local api_key = os.getenv("DNSDIST_API_KEY") or "changeme"
webserver("0.0.0.0:8083")
setWebserverConfig({
  password = web_pw,
  apiKey   = api_key,
  acl      = "0.0.0.0/0"
})
