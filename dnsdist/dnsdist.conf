-- Override the NSID (EDNS option 3) response with a static, non-revealing
-- value so scanners can't read the container hostname out of it.
setLocal("0.0.0.0:53", { nsid = "dnsdist" })
addACL("0.0.0.0/0")

-- TCP path tuning. Pair with pdns's raised max-tcp-connections so TCP
-- query load isn't choked by connection setup.
setMaxTCPClientThreads(4)
setMaxCachedTCPConnectionsPerDownstream(10)

-- dnsdist's newServer() requires an IP literal at config-load time, not a
-- hostname. The pdns container is pinned to 10.89.1.10 in compose.yml.
newServer({
  address="10.89.1.10:5300",
  name="pdns-auth",
  pool="auth"
})

addAction(AllRule(), PoolAction("auth"))

-- Drop queries with abnormally long names (random-subdomain / water-torture
-- defense). Wire length > 255 bytes is dropped.
addAction(QNameWireLengthRule(1, 255), DropAction())

-- Per-client QPS defense. TCAction sends TC=1 on UDP so real clients
-- retry over TCP; spoofed/amplification sources cannot complete the
-- handshake.
addAction(MaxQPSIPRule(100, 24, 56, 500), TCAction())

-- Dynamic block rules evaluated every second via maintenance callback.
local dbr = dynBlockRulesGroup()
dbr:setQueryRate(10, 10, "Exceeded query rate", 60, DNSAction.Drop)
dbr:setRCodeRate(DNSRCode.NXDOMAIN, 5, 10, "Exceeded NXD rate", 60, DNSAction.Drop)
dbr:setRCodeRate(DNSRCode.SERVFAIL, 5, 10, "Exceeded ServFail rate", 60, DNSAction.Drop)
dbr:setQTypeRate(DNSQType.ANY, 2, 10, "Exceeded ANY rate", 60, DNSAction.Drop)
dbr:setResponseByteRate(100000, 10, "Exceeded resp BW rate", 60, DNSAction.Drop)
addMaintenanceCallback(function() dbr:apply() end)

-- Ring buffers for topClients(), topQueries(), topSlow() and DDoS forensics.
setRingBuffersSize(10000, 10)

-- Web console / HTTP API on :8083 inside the container. The published port
-- is bound to loopback + Tailscale IP in compose.yml — the public internet
-- never sees it.
local web_pw  = os.getenv("DNSDIST_WEBSERVER_PASSWORD") or "changeme"
local api_key = os.getenv("DNSDIST_API_KEY") or "changeme"
webserver("0.0.0.0:8083")
setWebserverConfig({
  password = web_pw,
  apiKey   = api_key,
  acl      = "127.0.0.1, ::1",
  statsRequireAuthentication = false
})